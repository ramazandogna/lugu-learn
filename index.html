<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lugu — Küçük adımlar, büyük hayaller. Özel İngilizce öğrenme ve koçluk platformu." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lugu</title>
    <script>
      // Before the first paint, so a stored dark choice does not flash light.
      try {
        var s = localStorage.getItem('lugu-theme')
        if (s === 'dark' || ((s === null || s === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
